app:
  name: "RMI AIS Vessel Tracker"
  version: "1.0.0"
  default_station: "Station-Desktop-01"

storage:
  database_path: "data/rmi_ais.db"
  export_dir: "data/exports"

simulator:
  update_interval_sec: 3.0
  # Preset vessels modeled matching VesselFinder format (Merak / Sunda Strait region)
  vessels:
    - mmsi: 525019876
      name: "Virgo 18"
      ship_type: "Passenger/Ro-Ro Cargo Ship"
      imo: 9123456
      call_sign: "YCGR"
      draught: 5.2
      destination: "BAKAUHENI"
      eta: "10-13 06:00"
      gross_tonnage: 9989
      deadweight: 3500
      length: 134.0
      beam: 22.0
      year_built: 2015
      flag: "Indonesia"
      initial_lat: -5.9320
      initial_lon: 105.9980
      initial_sog: 13.9
      initial_cog: 107.3
      initial_hdg: 109
      nav_status: 0 # Under way using engine

    - mmsi: 525022134
      name: "Batam Jet 2"
      ship_type: "High Speed Craft"
      imo: 8976543
      call_sign: "POWZ"
      draught: 2.1
